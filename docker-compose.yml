services:
  postgres:
    image: postgres:15-alpine
    container_name: tinder_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tinder_clone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tinder_network

  redis:
    image: redis:7-alpine
    container_name: tinder_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tinder_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinder_backend
    environment:
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tinder_clone?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRE_HOURS=24
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_DIR=/app/uploads
      - NSFW_SERVICE_URL=http://nsfw-service:8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-http://localhost/api/auth/oauth/google/callback}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - FACEBOOK_REDIRECT_URL=${FACEBOOK_REDIRECT_URL:-http://localhost/api/auth/oauth/facebook/callback}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tinder_network

  nsfw-service:
    build:
      context: ./nsfw-service
      dockerfile: Dockerfile
    container_name: tinder_nsfw
    ports:
      - "8000:8000"
    networks:
      - tinder_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tinder_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tinder_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  tinder_network:
    driver: bridge
