name: Deploy to Production

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        working-directory: ./backend
        run: |
          go test -v ./...

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t tinder-backend:${{ github.sha }} .
          docker build --build-arg GIT_SHA=${{ github.sha }} -t tinder-backend:latest .

      - name: Save Docker image
        run: |
          docker save tinder-backend:latest | gzip > backend-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: backend-image.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_ORIGIN: https://api.vnhatng.com
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Upload files to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          # Create temporary directory
          ssh ${SSH_USER}@${SSH_HOST} "mkdir -p /tmp/deploy-$(date +%s)"
          DEPLOY_TMP=$(ssh ${SSH_USER}@${SSH_HOST} "ls -dt /tmp/deploy-* | head -1")
          
          # Upload Docker image
          scp backend-image.tar.gz ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/
          
          # Upload deployment files (upload deploy dir so ${DEPLOY_TMP}/deploy exists on server)
          scp -r deploy ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/
          scp -r backend ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/
          scp -r frontend/dist ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/frontend-dist

      - name: Deploy on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${SSH_USER}@${SSH_HOST} << 'ENDSSH'
            set -e
            
            # Get the temporary deployment directory
            DEPLOY_TMP=$(ls -dt /tmp/deploy-* | head -1)
            APP_DIR="/opt/tinder-app"
            
            echo "Deploying from ${DEPLOY_TMP} to ${APP_DIR}"
            
            # Create backup
            if [ -d "${APP_DIR}" ]; then
              BACKUP_DIR="${APP_DIR}/backups/pre-deploy-$(date +%Y%m%d_%H%M%S)"
              mkdir -p ${BACKUP_DIR}
              
              # Backup current deployment
              [ -f "${APP_DIR}/deploy/docker-compose.prod.yml" ] && \
                docker compose -f ${APP_DIR}/deploy/docker-compose.prod.yml --env-file ${APP_DIR}/deploy/.env.production down || true
              
              # Backup volumes
              docker run --rm -v tinder_postgres_data:/data -v ${BACKUP_DIR}:/backup alpine \
                tar czf /backup/postgres_data.tar.gz -C /data . || true
              docker run --rm -v tinder_uploads_data:/data -v ${BACKUP_DIR}:/backup alpine \
                tar czf /backup/uploads_data.tar.gz -C /data . || true
            fi
            
            # Load new Docker image
            docker load < ${DEPLOY_TMP}/backend-image.tar.gz
            
            # Update application files
            mkdir -p ${APP_DIR}
            cp -r ${DEPLOY_TMP}/deploy ${APP_DIR}/
            cp -r ${DEPLOY_TMP}/backend ${APP_DIR}/
            mkdir -p ${APP_DIR}/frontend/dist
            cp -r ${DEPLOY_TMP}/frontend-dist/* ${APP_DIR}/frontend/dist/
            
            # Preserve .env.production if it exists
            if [ -f "${APP_DIR}/deploy/.env.production" ]; then
              echo "Preserving existing .env.production"
            else
              echo "ERROR: .env.production not found!"
              exit 1
            fi
            
            # Make scripts executable
            chmod +x ${APP_DIR}/deploy/scripts/*.sh
            
            # Deploy using the loaded image (--no-build so CI-built backend is used, not a rebuild from source)
            cd ${APP_DIR}/deploy
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build
            
            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 15
            
            # Restore SSL config (deploy overwrites default.conf with HTTP-only; switch back so 443 works)
            ./scripts/switch-nginx-to-ssl.sh || true
            sleep 2
            
            # Health check
            if curl -f http://localhost/health > /dev/null 2>&1; then
              echo "✓ Deployment successful!"
            else
              echo "✗ Health check failed!"
              docker compose -f docker-compose.prod.yml --env-file .env.production logs
              exit 1
            fi
            
            # Cleanup
            rm -rf ${DEPLOY_TMP}
            
            # Prune old Docker resources
            docker system prune -f --volumes=false || true
            
            echo "Deployment completed at $(date)"
          ENDSSH

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          # Wait a bit more for services to stabilize
          sleep 10
          
          if [ -n "$DOMAIN" ]; then
            echo "Testing HTTPS /health via SSH (curl --resolve to avoid hairpin and GitHub→EC2 dependency)"
            # Run HTTPS check on EC2: hit 127.0.0.1:443 with Host/SNI = DOMAIN so SSL and /health are verified
            ssh ${SSH_USER}@${SSH_HOST} "curl -sf --connect-timeout 10 --resolve ${DOMAIN}:443:127.0.0.1 https://${DOMAIN}/health" || exit 1
          else
            echo "DOMAIN not set, testing health via SSH (http://localhost/health)"
            ssh ${SSH_USER}@${SSH_HOST} "curl -sf http://localhost/health" || exit 1
          fi
          
          echo "✓ Deployment verification passed!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🚀 Deployment to production completed successfully!"
          else
            echo "❌ Deployment to production failed!"
            exit 1
          fi
